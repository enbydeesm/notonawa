<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People · Rope Journal</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>People</h1>

    <section class="card">
      <h2>Add a person</h2>
      <form id="form">
        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="pronouns">Pronouns</label>
        <input id="pronouns" name="pronouns" placeholder="e.g. they/them">

        <label class="inline"><input type="checkbox" name="is_self"> This is me</label>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes"></textarea>

        <button type="submit" class="primary">Add person</button>
        <button type="button" class="link" data-cancel-edit hidden>Cancel editing</button>
        <p class="message"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Your people</h2>
        <label class="inline"><input type="checkbox" id="show-archived"> Show archived</label>
      </div>
      <div id="list"><p class="empty">Loading…</p></div>
    </section>
  </main>

  <script type="module" src="/js/pages/people.js"></script>
</body>
</html>
