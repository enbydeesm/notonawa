<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rope Journal</title>
  <style>
    :root {
      --bg: #faf8f5; --card: #ffffff; --text: #222; --muted: #6b6b6b;
      --line: #e4dfd8; --accent: #8a3b2e; --accent-text: #fff; --error: #b00020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514; --card: #201f1d; --text: #eee; --muted: #a09a93;
        --line: #34312d; --accent: #d07a62; --accent-text: #161514; --error: #ff6b81;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.6rem; margin: 8px 0 16px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin: 10px 0 4px; }
    input, textarea, select {
      width: 100%; padding: 10px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      margin-top: 14px; width: 100%; padding: 12px; font: inherit; font-weight: 600;
      background: var(--accent); color: var(--accent-text);
      border: none; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #message { min-height: 1.5em; margin: 8px 0 0; font-size: 0.9rem; }
    #message.error { color: var(--error); }
    .tie { border-top: 1px solid var(--line); padding: 12px 0; }
    .tie:first-child { border-top: none; padding-top: 0; }
    .tie-title { font-weight: 600; }
    .tie-meta { color: var(--muted); font-size: 0.9rem; }
    .tie-notes { margin-top: 4px; white-space: pre-wrap; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Rope Journal</h1>

    <section class="card">
      <h2>Log a tie</h2>
      <form id="tie-form">
        <label for="title">Title</label>
        <input id="title" name="title" placeholder="e.g. Hip harness to futomomo">

        <div class="row">
          <div>
            <label for="tie_date">Date</label>
            <input id="tie_date" name="tie_date" type="date">
          </div>
          <div>
            <label for="duration_minutes">Duration (min)</label>
            <input id="duration_minutes" name="duration_minutes" type="number" min="0" max="1440" inputmode="numeric">
          </div>
        </div>

        <label for="success_rating">How did it go?</label>
        <select id="success_rating" name="success_rating">
          <option value="">Not rated</option>
          <option value="1">1 – Rough</option>
          <option value="2">2</option>
          <option value="3">3 – OK</option>
          <option value="4">4</option>
          <option value="5">5 – Great</option>
        </select>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="What happened, what changed, what to try next"></textarea>

        <button type="submit" id="save">Save tie</button>
        <p id="message"></p>
      </form>
    </section>

    <section class="card">
      <h2>My ties</h2>
      <div id="tie-list"><p class="empty">Loading…</p></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("tie-form");
    const list = document.getElementById("tie-list");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("save");

    // Default the date to today
    document.getElementById("tie_date").value = new Date().toLocaleDateString("en-CA");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    function formatDate(isoDate) {
      if (!isoDate) return "No date";
      const [y, m, d] = isoDate.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, {
        year: "numeric", month: "short", day: "numeric",
      });
    }

    async function loadTies() {
      try {
        const res = await fetch("/api/ties");
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        const ties = await res.json();

        list.replaceChildren();
        if (ties.length === 0) {
          list.innerHTML = '<p class="empty">No ties yet. Log your first one above.</p>';
          return;
        }

        for (const tie of ties) {
          const item = document.createElement("div");
          item.className = "tie";

          const title = document.createElement("div");
          title.className = "tie-title";
          title.textContent = tie.title || "Untitled tie";

          const meta = document.createElement("div");
          meta.className = "tie-meta";
          const bits = [formatDate(tie.tie_date)];
          if (tie.duration_minutes != null) bits.push(`${tie.duration_minutes} min`);
          if (tie.success_rating != null) bits.push(`${tie.success_rating}/5`);
          meta.textContent = bits.join(" · ");

          item.append(title, meta);

          if (tie.notes) {
            const notes = document.createElement("div");
            notes.className = "tie-notes";
            notes.textContent = tie.notes;
            item.append(notes);
          }

          list.append(item);
        }
      } catch (err) {
        list.innerHTML = "";
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Couldn't load ties: " + err.message;
        list.append(p);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      saveButton.disabled = true;
      showMessage("Saving…");

      const data = Object.fromEntries(new FormData(form));

      try {
        const res = await fetch("/api/ties", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || res.statusText);

        form.reset();
        document.getElementById("tie_date").value = new Date().toLocaleDateString("en-CA");
        showMessage("Saved.");
        loadTies();
      } catch (err) {
        showMessage("Couldn't save: " + err.message, true);
      } finally {
        saveButton.disabled = false;
      }
    });

    loadTies();
  </script>
</body>
</html>
