<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotoNawa</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <!-- The app's only page (every view's address serves it: see
       not_found_handling in wrangler.jsonc). app.js draws the nav into
       <main> and puts the view for the address into #view, from one of the
       templates below. -->
  <main>
    <!-- Messages from us (notices.js) go between the nav and the view. -->
    <div id="view"></div>
  </main>

  <!-- Ties (/) -->
  <template id="view-ties">
    <!-- Hidden: the tab says where you are. Kept for screen readers, and
         as where focus goes on changing view (app.js). -->
    <h1 class="visually-hidden">NotoNawa</h1>

    <section class="card" role="search" aria-label="Search ties">
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="Title, notes or plan" autocomplete="off" spellcheck="false">

      <label id="people-label">People</label>
      <div id="people-filter"></div>
      <p class="hint">Ties with all of the people you choose.</p>

      <label id="locations-label">Locations</label>
      <div id="locations-filter"></div>

      <div class="row">
        <div>
          <label for="from">From</label>
          <input id="from" type="date" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="to">To</label>
          <input id="to" type="date" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="label-row">
        <label id="tags-label">Has Tags</label>
        <button type="button" class="label-add" id="tags-choose" aria-label="Choose tags" title="Choose tags">+</button>
        <div class="match-toggle" role="group" aria-label="Match tags">
          <button type="button" id="tags-any" aria-pressed="true" title="Ties with any of the tags">OR</button>
          <button type="button" id="tags-all" aria-pressed="false" title="Ties with all of the tags">AND</button>
        </div>
      </div>
      <div class="tag-row" id="tag-filter" aria-labelledby="tags-label"></div>

      <button type="button" class="link" id="clear" hidden>Clear search</button>
    </section>

    <section class="card" id="results">
      <div class="card-header list-header">
        <h2>My ties</h2>
        <span class="item-meta" id="tie-count"></span>
        <div class="list-controls">
          <select id="page-size" aria-label="Ties per page" title="Ties per page">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button type="button" class="icon-button" id="sort" aria-label="Oldest first" aria-pressed="false" title="Newest first">
            <svg viewBox="0 0 24 24" class="sort-icon" aria-hidden="true" focusable="false">
              <path d="M7 4v16M3 16l4 4 4-4M14 6h7M14 11h5M14 16h3"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="tie-list"><p class="empty">Loading…</p></div>
      <div class="pager" id="pager" role="navigation" aria-label="Pages"></div>
    </section>
  </template>

  <!-- Plans (/plans) -->
  <template id="view-plans">
    <h1 class="visually-hidden">Plans</h1>

    <section class="card">
      <h2>Add a plan</h2>
      <form id="form">
        <label for="title">Title</label>
        <input id="title" name="title" required placeholder="e.g. Hip harness to futomomo" autocomplete="off" spellcheck="false">

        <div class="row">
          <div>
            <!-- Type replaced Stage on the form (stage stays in the database). -->
            <label for="plan_type">Plan type</label>
            <select id="plan_type" name="plan_type">
              <option value="idea">Idea</option>
              <option value="harness">Harness</option>
              <option value="sequence">Sequence</option>
            </select>
          </div>
          <div>
            <!-- Optional, unlike a tie's; views/plans.js adds the types. -->
            <label for="tie_type">Tie type</label>
            <select id="tie_type" name="tie_type">
              <option value="">–</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <!-- Rope hanks, like a tie's rating (views/plans.js draws them). -->
            <label id="est_difficulty-label">Difficulty</label>
            <div id="est_difficulty-picker"></div>
          </div>
          <div>
            <label for="variation_of">Variation of</label>
            <select id="variation_of" name="variation_of">
              <option value="">N/A</option>
            </select>
          </div>
        </div>

        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="The sequence, step by step" autocomplete="off" spellcheck="false"></textarea>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" autocomplete="off" spellcheck="false"></textarea>

        <!-- Encrypted like the notes; views/plans.js sets its pattern and checks it. -->
        <label for="album_url">Album link</label>
        <input id="album_url" name="album_url" type="url" inputmode="url" placeholder="https://photos.app.goo.gl/…"
          title="A web address, starting with https://" autocomplete="off" spellcheck="false">

        <div data-photos></div>

        <div class="label-row">
          <label id="plan-tags-label">Tags</label>
          <button type="button" class="label-add" id="plan-add-tags" aria-label="Edit tags" title="Edit tags">+</button>
        </div>
        <div class="tag-row" id="plan-tags"></div>

        <button type="submit" class="primary">Add plan</button>
        <button type="button" class="link" data-cancel-edit hidden>Cancel editing</button>
        <p class="message"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Your plans</h2>
        <label class="inline"><input type="checkbox" id="show-archived"> Show archived</label>
      </div>
      <div id="list"><p class="empty">Loading…</p></div>
    </section>
  </template>

  <!-- People (/people) -->
  <template id="view-people">
    <h1 class="visually-hidden">People</h1>

    <section class="card">
      <h2>Add a person</h2>
      <form id="form">
        <!-- "This is me" shows only when editing my own profile, ticked and
             greyed out: it can't be changed (people.js). -->
        <div class="name-row">
          <label for="name">Name</label>
          <label class="self-flag" id="self-flag" hidden><input type="checkbox" name="is_self" disabled> This is me</label>
        </div>
        <input id="name" name="name" required autocomplete="off" spellcheck="false">

        <div class="row">
          <div>
            <label for="pronouns">Pronouns</label>
            <input id="pronouns" name="pronouns" placeholder="e.g. they/them" autocomplete="off" spellcheck="false">
          </div>
          <div>
            <label for="default_role">Default role</label>
            <!-- The roles are added by people.js, from the same list as the tie form's. -->
            <select id="default_role" name="default_role">
              <option value="">None</option>
            </select>
          </div>
        </div>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" autocomplete="off" spellcheck="false"></textarea>

        <button type="submit" class="primary">Add person</button>
        <button type="button" class="link" data-cancel-edit hidden>Cancel editing</button>
        <p class="message"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Your people</h2>
        <label class="inline"><input type="checkbox" id="show-archived"> Show archived</label>
      </div>
      <div id="list"><p class="empty">Loading…</p></div>
    </section>
  </template>

  <!-- Locations (/locations) -->
  <template id="view-locations">
    <h1 class="visually-hidden">Locations</h1>

    <section class="card">
      <h2>Add a location</h2>
      <form id="form">
        <!-- Only one location is the default; ticking another asks whether
             to replace it (locations.js). Not for one archived now. -->
        <div class="name-row">
          <label for="name">Name</label>
          <label class="self-flag" id="default-flag"><input type="checkbox" name="is_default" id="is_default"> Default on new ties</label>
        </div>
        <input id="name" name="name" required autocomplete="off" spellcheck="false">

        <label for="maps_url">Google Maps link (dropped pins work best)</label>
        <input id="maps_url" name="maps_url" type="url" placeholder="https://maps.app.goo.gl/…" autocomplete="off" spellcheck="false">
        <p class="hint" id="maps-hint">Paste a link to fill in the latitude and longitude.</p>

        <div class="row">
          <div>
            <label for="latitude">Latitude</label>
            <input id="latitude" name="latitude" type="number" step="any" min="-90" max="90" autocomplete="off" spellcheck="false">
          </div>
          <div>
            <label for="longitude">Longitude</label>
            <input id="longitude" name="longitude" type="number" step="any" min="-180" max="180" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" autocomplete="off" spellcheck="false"></textarea>

        <div data-add-only>
          <label class="inline"><input type="checkbox" name="archive_now" id="archive_now"> Archive now</label>
          <p class="hint">For a one-off spot: it's saved for your ties, but kept out of the location picker.</p>
        </div>

        <button type="submit" class="primary">Add location</button>
        <button type="button" class="link" data-cancel-edit hidden>Cancel editing</button>
        <p class="message"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Your locations</h2>
        <label class="inline"><input type="checkbox" id="show-archived"> Show archived</label>
      </div>
      <div id="list"><p class="empty">Loading…</p></div>
    </section>
  </template>

  <!-- Calendar: a month, with its numbers and a hank on each day with ties.
       views/calendar.js fills it in. -->
  <template id="view-calendar">
    <h1>Calendar</h1>

    <section class="card">
      <!-- The arrows either side of the month, on one row. -->
      <div class="period-nav cal-nav">
        <button type="button" class="icon-button step-button" id="cal-prev" aria-label="Previous month" title="Previous month">
          <svg viewBox="0 0 24 24" class="step-icon" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 class="period-title" id="cal-title" aria-live="polite"></h2>
        <button type="button" class="icon-button step-button" id="cal-next" aria-label="Next month" title="Next month">
          <svg viewBox="0 0 24 24" class="step-icon" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <dl class="stat-grid" id="cal-stats"></dl>
      <p class="message error" id="cal-message" role="alert"></p>
      <div id="calendar"></div>
    </section>
  </template>

  <!-- Analytics: a period's numbers and charts. views/analytics.js fills it in. -->
  <template id="view-analytics">
    <h1>Analytics</h1>

    <div id="insights-panel">
      <section class="card">
        <div class="insight-controls">
          <select id="period" aria-label="Time period"></select>
          <select id="role" aria-label="My role"></select>
          <button type="button" class="icon-button filter-button" id="more-filters" aria-label="More filters" title="More filters" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" class="funnel-icon" aria-hidden="true" focusable="false"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>
            <span class="filter-count" id="filter-count" aria-hidden="true" hidden></span>
          </button>
        </div>
        <div class="row" id="custom-dates" hidden>
          <div>
            <label for="insights-from">From</label>
            <input id="insights-from" type="date" autocomplete="off" spellcheck="false">
          </div>
          <div>
            <label for="insights-to">To</label>
            <input id="insights-to" type="date" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="period-nav">
          <button type="button" class="icon-button step-button" id="period-prev" aria-label="Previous year" title="Previous">
            <svg viewBox="0 0 24 24" class="step-icon" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h2 class="period-title" id="period-title" aria-live="polite"></h2>
          <button type="button" class="icon-button step-button" id="period-next" aria-label="Next year" title="Next">
            <svg viewBox="0 0 24 24" class="step-icon" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <dl class="stat-pairs" id="insights-stats"></dl>
        <p class="message error" id="insights-message" role="alert"></p>
      </section>

      <section class="card">
        <h2>Tie count</h2>
        <div id="tie-count-chart"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Tied with</h2>
          <span class="item-meta">Top 10</span>
        </div>
        <div id="partner-chart"></div>
      </section>

      <section class="card">
        <h2>Tie types</h2>
        <div id="type-chart"></div>
      </section>

      <div class="pie-pair">
        <section class="card">
          <h2>Days of the week</h2>
          <div id="weekday-chart"></div>
        </section>
        <section class="card">
          <h2>Locations</h2>
          <div id="location-chart"></div>
        </section>
      </div>
    </div>
  </template>

  <!-- Account (/account) -->
  <template id="view-account">
    <h1>Account</h1>

    <section class="card">
      <h2>Passkeys</h2>
      <p class="hint">Add one on each device you use, so losing one doesn't lock you out.</p>
      <div id="passkeys"><p class="empty">Loading…</p></div>
      <form id="add-form">
        <label for="add-name">Add a passkey on this device</label>
        <input id="add-name" maxlength="60" autocomplete="off" spellcheck="false" placeholder="e.g. My laptop">
        <button type="submit">Add passkey</button>
        <p class="message" id="passkey-message"></p>
      </form>
    </section>

    <section class="card">
      <h2>Where you're signed in</h2>
      <div id="sessions"><p class="empty">Loading…</p></div>
      <button type="button" id="end-others">Sign out everywhere else</button>
      <p class="message" id="session-message"></p>
    </section>

    <section class="card">
      <h2>Recovery code</h2>
      <p class="hint" id="recovery-status"></p>
      <button type="button" id="new-code">Make a new recovery code</button>
      <p class="message" id="recovery-message"></p>
    </section>

    <section class="card">
      <h2>Recovery email</h2>
      <p class="hint" id="email-status"></p>
      <form id="email-form" hidden>
        <div class="label-row">
          <label for="recovery-email">Email address (optional)</label>
          <button type="button" class="info-button" id="email-info-button" aria-label="About the recovery email"
            title="About the recovery email" aria-expanded="false" aria-controls="email-info">i</button>
        </div>
        <p class="info-text" id="email-info" hidden>Optional. If you lose every passkey and your recovery code, this is
          the only way we can check the account is yours and help you sign in again. We keep only a scrambled copy,
          so we can't see the address or send you email. Signing in this way doesn't unlock your encrypted notes and
          photos: only a passkey or recovery code that unlocked them before can.</p>
        <input id="recovery-email" type="email" maxlength="254" autocomplete="off" spellcheck="false">
        <label for="recovery-email-again">Type it again</label>
        <input id="recovery-email-again" type="email" maxlength="254" autocomplete="off" spellcheck="false">
        <p class="hint">You won't be able to see it again, so check it's right.</p>
        <div class="item-actions">
          <button type="submit">Save recovery email</button>
          <button type="button" id="email-cancel" hidden>Cancel</button>
        </div>
      </form>
      <div class="item-actions" id="email-actions" hidden>
        <button type="button" id="email-change">Change</button>
        <button type="button" class="danger" id="email-remove">Remove</button>
      </div>
      <p class="message" id="email-message"></p>
    </section>

    <button type="button" class="primary" id="sign-out">Sign out</button>
    <p class="message" id="sign-out-message"></p>

    <section class="card delete-account">
      <h2>Delete account</h2>
      <p class="hint">Deletes your account and everything in your journal, for good. If you want a copy,
        <a href="/data">export your data</a> first.</p>
      <button type="button" class="danger" id="delete-account">Delete my account</button>
      <p class="message" id="delete-message"></p>
    </section>
  </template>

  <!-- Your data (/data) -->
  <template id="view-data">
    <h1>Your data</h1>

    <section class="card">
      <h2>Export</h2>
      <p class="hint">Everything in your journal (ties, plans, people, locations and tags) in one file: a .zip with
        your photos in it if you have any. The file isn't encrypted, so keep it somewhere safe.</p>
      <button type="button" class="primary" id="export">Download my data</button>
      <p class="message" id="export-message"></p>
    </section>

    <section class="card">
      <h2>Import</h2>
      <p class="hint">Add to your journal from a NotoNawa export, or from a spreadsheet of ties saved as CSV
        (<a href="/import-template.csv" download>download a template</a>). People, locations and plans are matched to
        yours by name, and new ones are added. Ties already in your journal are skipped. You'll see what will happen
        before anything is saved.</p>
      <label for="import-file">File (.zip, .json or .csv)</label>
      <input type="file" id="import-file" accept=".zip,.json,.csv,application/zip,application/json,text/csv" autocomplete="off" spellcheck="false">
      <div id="import-preview" class="import-preview" hidden></div>
      <button type="button" class="primary" id="import-go" hidden>Import</button>
      <p class="message" id="import-message"></p>
    </section>
  </template>

  <!-- Sign in (/signin) -->
  <template id="view-signin">
    <h1 class="app-title"><img src="/img/logo.png" alt="NotoNawa"></h1>

    <section class="card" id="choose" hidden>
      <h2>Sign in</h2>
      <p class="hint">NotoNawa uses passkeys: your phone or computer unlocks it with Face ID, a fingerprint or your PIN. There's no password.</p>
      <button type="button" class="primary" id="sign-in">Sign in with a passkey</button>
      <p class="message" id="sign-in-message"></p>
      <button type="button" class="link" data-show="signup">Create an account (invite needed)</button><br>
      <button type="button" class="link" data-show="recover">Use a recovery code</button>
    </section>

    <section class="card" id="signup" hidden>
      <h2>Create an account</h2>
      <form id="signup-form">
        <label for="invite">Invite code</label>
        <input id="invite" required autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX">

        <label for="passkey-name">Name for this passkey</label>
        <input id="passkey-name" maxlength="60" autocomplete="off" spellcheck="false" placeholder="e.g. My phone">
        <p class="hint">So you can tell your passkeys apart later.</p>

        <label class="inline"><input type="checkbox" id="adult" required> I'm 18 or older</label>
        <label class="inline"><input type="checkbox" id="consent" required> <span>I agree to the <a href="/privacy" target="_blank" rel="noopener">privacy policy</a>, including storing details of my and other people's sex lives</span></label>
        <p class="hint">Only record what the people you tie with would be comfortable with.</p>

        <button type="submit" class="primary">Create account</button>
        <p class="message" id="signup-message"></p>
      </form>
      <button type="button" class="link" data-show="choose">Back</button>
    </section>

    <section class="card" id="recover" hidden>
      <h2>Use a recovery code</h2>
      <form id="recover-form">
        <label for="code">Recovery code</label>
        <input id="code" required autocomplete="off" spellcheck="false" autocapitalize="characters">
        <button type="submit" class="primary">Continue</button>
        <p class="message" id="recover-message"></p>
      </form>
      <button type="button" class="link" data-show="choose">Back</button>
    </section>

    <section class="card" id="add-passkey" hidden>
      <h2>Add a passkey</h2>
      <p class="hint">You're signed in with your recovery code. Add a passkey on this device to finish; you'll then get a new recovery code.</p>
      <form id="add-passkey-form">
        <label for="new-passkey-name">Name for this passkey</label>
        <input id="new-passkey-name" maxlength="60" autocomplete="off" spellcheck="false" placeholder="e.g. My phone">
        <button type="submit" class="primary">Add passkey</button>
        <p class="message" id="add-passkey-message"></p>
      </form>
    </section>
    <p class="hint help-line">Trouble signing in? Email <a href="mailto:contact@notonawa.app">contact@notonawa.app</a> for assistance.</p>
    <!-- Filled in by views/signin.js (public/js/releases.js) -->
    <p class="hint app-version" id="signin-version"></p>
  </template>

  <!-- In place of any view that needs the key, while the journal is locked -->
  <template id="view-unlock">
    <h1 class="app-title"><img src="/img/logo.png" alt="NotoNawa"></h1>

    <section class="card" id="unlock-choose" hidden>
      <h2>Your journal is locked</h2>
      <p class="hint">It locks itself when you haven't used it for a while, and when you leave the app. Unlock it with your passkey.</p>
      <button type="button" class="primary" id="unlock-passkey">Unlock with your passkey</button>
      <p class="message" id="unlock-passkey-message"></p>
      <button type="button" class="link" data-unlock-show="code">Use your recovery code instead</button>
    </section>

    <section class="card" id="unlock-code" hidden>
      <h2>Unlock with your recovery code</h2>
      <p class="hint" id="unlock-code-why"></p>
      <form id="unlock-code-form">
        <label for="unlock-code-input">Recovery code</label>
        <input id="unlock-code-input" required autocomplete="off" spellcheck="false" autocapitalize="characters">
        <button type="submit" class="primary">Unlock</button>
        <p class="message" id="unlock-code-message"></p>
      </form>
      <button type="button" class="link" data-unlock-show="choose">Back</button>
    </section>

    <section class="card" id="unlock-setup" hidden>
      <h2>Set up encryption</h2>
      <p class="hint">NotoNawa now encrypts your private notes on your device, so only you can read them. Your
        journal needs its encryption key first. You'll get a new recovery code, which unlocks it and replaces your
        old one: save it somewhere safe.</p>
      <button type="button" class="primary" id="unlock-setup-go">Set up encryption</button>
      <p class="message" id="unlock-setup-message"></p>
    </section>

    <section class="card" id="unlock-cant" hidden>
      <h2>That recovery code can't unlock your journal</h2>
      <p class="hint">Your recovery code was replaced when we helped you sign in, and your journal is still locked
        with the old one. An older recovery code can unlock it, or a passkey that unlocked it before. If you have
        neither, you can start a new encryption key: anything encrypted with the old key can't be read again, and
        your photos are deleted.</p>
      <div class="item-actions">
        <button type="button" data-unlock-show="code">Try another recovery code</button>
        <button type="button" class="danger" id="unlock-new-key">Start a new key</button>
      </div>
      <p class="message" id="unlock-new-key-message"></p>
    </section>

    <button type="button" class="link" id="unlock-sign-out">Sign out</button>
    <p class="hint help-line">Trouble signing in? Email <a href="mailto:contact@notonawa.app">contact@notonawa.app</a> for assistance.</p>
  </template>

  <!-- Any other address -->
  <!-- Shown in place of the journal until I agree to a changed privacy
       policy (views/consent.js). -->
  <template id="view-consent">
    <h1 class="app-title"><img src="/img/logo.png" alt="NotoNawa"></h1>

    <section class="card">
      <h2>Our privacy policy has changed</h2>
      <p id="consent-summary">Please read the updated policy, and agree to it to keep using NotoNawa.</p>
      <p><a href="/privacy.html" target="_blank" rel="noopener">Read the privacy policy</a> (opens in a new tab)</p>
      <label class="inline"><input type="checkbox" id="consent-agree"> I've read and agree to the updated privacy policy</label>
      <button type="button" class="primary" id="consent-go" disabled>Agree and continue</button>
      <p class="message" id="consent-message"></p>
    </section>

    <section class="card">
      <h2>If you don't agree</h2>
      <p class="hint">Nothing new can be saved to your journal until you agree, but you can still take it with you,
        or delete your account and everything in it.</p>
      <ul class="consent-ways">
        <li><a href="/data">Export your data</a></li>
        <li><a href="/account">Delete your account</a> (at the bottom of the page)</li>
      </ul>
      <button type="button" class="link" id="consent-sign-out">Sign out</button>
    </section>
  </template>

  <template id="view-not-found">
    <h1>Page not found</h1>
    <section class="card">
      <p>There's nothing at this address.</p>
      <a href="/">Go to your ties</a>
    </section>
  </template>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
