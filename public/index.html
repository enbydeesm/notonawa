<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rope Journal</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Rope Journal</h1>

    <section class="card">
      <h2>Log a tie</h2>
      <form id="tie-form">
        <label for="title">Title</label>
        <input id="title" name="title" placeholder="e.g. Hip harness to futomomo">

        <div class="row">
          <div>
            <label for="tie_date">Date</label>
            <input id="tie_date" name="tie_date" type="date">
          </div>
          <div>
            <label for="duration_minutes">Duration (min)</label>
            <input id="duration_minutes" name="duration_minutes" type="number" min="0" max="1440" inputmode="numeric">
          </div>
        </div>

        <label for="location_id">Location</label>
        <select id="location_id" name="location_id">
          <option value="">No location</option>
        </select>

        <label>People</label>
        <div id="participants"></div>
        <button type="button" id="add-participant">Add person</button>
        <p class="hint" id="no-people" hidden>Add people on the <a href="/people">People</a> page first.</p>

        <label>Plans</label>
        <div id="plans"></div>
        <button type="button" id="add-plan">Add plan</button>
        <p class="hint" id="no-plans" hidden>Add plans on the <a href="/plans">Plans</a> page first.</p>

        <label for="success_rating">How did it go?</label>
        <select id="success_rating" name="success_rating">
          <option value="">Not rated</option>
          <option value="1">1 – Rough</option>
          <option value="2">2</option>
          <option value="3">3 – OK</option>
          <option value="4">4</option>
          <option value="5">5 – Great</option>
        </select>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="What happened, what changed, what to try next"></textarea>

        <button type="submit" class="primary" id="save">Save tie</button>
        <p class="message" id="message"></p>
      </form>
    </section>

    <section class="card">
      <h2>My ties</h2>
      <div id="tie-list"><p class="empty">Loading…</p></div>
    </section>
  </main>

  <script type="module" src="/js/pages/ties.js"></script>
</body>
</html>
